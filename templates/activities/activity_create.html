{% extends "base.html" %}

{% block title %}Proponer Actividad{% endblock %}

{% block custom_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/activities.css') }}">
{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px;">

    <h2 class="form-title">📝 Proponer una actividad</h2>
    <p class="form-subtitle">Tu propuesta será revisada por un administrador antes de publicarse.</p>

    <form method="post" enctype="multipart/form-data">
        <div>
            <label class="form-label">Título *</label>
            <input type="text" name="title" required placeholder="Ej: Charla sobre IA en la universidad" class="form-control">
        </div>

        <div>
            <label class="form-label">Descripción *</label>
            <textarea name="description" required rows="4" placeholder="Describe la actividad con detalle..." class="form-control"></textarea>
        </div>

        <div>
            <label class="form-label">Fecha y hora *</label>
            <input type="datetime-local" name="date" required class="form-control">
        </div>


        <div>
            <label class="form-label">Lugar *</label>
            <input type="text" name="location" required placeholder="Ej: Salón de actos, Facultad de Informática" class="form-control">
        </div>

        <div>
            <label class="form-label">Aforo máximo <span style="color:#999; font-weight:400;">(opcional)</span></label>
            <input type="number" name="capacity" min="1" placeholder="Ej: 50" class="form-control">
        </div>

        <div>
            <label class="form-label">Imagen o cartel <span style="color:#999; font-weight:400;">(opcional)</span></label>
            <input type="file" name="image" accept="image/*" class="form-control">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-create btn-flex">Enviar propuesta</button>
            <a href="{{ url_for('activities.activities_list') }}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

<script>
    function actualizarAforo(select) {
        const aforo = select.options[select.selectedIndex].getAttribute('data-aforo');
        document.getElementById('capacity').value = aforo || '';
    }
</script>

{% endblock %}
