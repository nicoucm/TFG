{% extends "base.html" %}

{% block title %}Proponer Actividad{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);">

    <h2 style="color: #2e7d32; margin-bottom: 0.5rem;">📝 Proponer una actividad</h2>
    <p style="color: #999; font-size: 0.9rem; margin-bottom: 2rem;">Tu propuesta será revisada por un administrador antes de publicarse.</p>

    <form method="post" enctype="multipart/form-data">

        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Título *</label>
            <input type="text" name="title" required placeholder="Ej: Charla sobre IA en la universidad"
                style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box;"
                onfocus="this.style.borderColor='#2e7d32'" onblur="this.style.borderColor='#ccc'">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Descripción *</label>
            <textarea name="description" required rows="4" placeholder="Describe la actividad con detalle..."
                style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; resize: vertical;"
                onfocus="this.style.borderColor='#2e7d32'" onblur="this.style.borderColor='#ccc'"></textarea>
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Fecha y hora *</label>
            <input type="datetime-local" name="date" required
                style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box;"
                onfocus="this.style.borderColor='#2e7d32'" onblur="this.style.borderColor='#ccc'">
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Ubicación *</label>
            <select name="location" required id="location-select"
                style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box;"
                onfocus="this.style.borderColor='#2e7d32'" onblur="this.style.borderColor='#ccc'"
                onchange="actualizarAforo(this)">
                <option value="">-- Selecciona una ubicación --</option>
                {% for u in ubicaciones %}
                    <option value="{{ u.nombre }}" data-aforo="{{ u.aforo }}">{{ u.nombre }} (aforo: {{ u.aforo }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Aforo máximo</label>
            <input type="number" name="capacity" id="capacity" min="1" readonly
                style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; background: #f5f5f5;">
            <p style="color: #999; font-size: 0.8rem; margin-top: 0.3rem;">Se rellena automáticamente según la ubicación.</p>
        </div>

        <div style="margin-bottom: 2rem;">
            <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Imagen o cartel <span style="color:#999; font-weight:400;">(opcional)</span></label>
            <input type="file" name="image" accept="image/*"
                style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn-create" style="flex: 1; padding: 12px; font-size: 1rem;">
                Enviar propuesta
            </button>
            <a href="{{ url_for('activities.activities_list') }}" style="flex: 1; padding: 12px; text-align: center; border: 1px solid #ccc; border-radius: 8px; color: #666; text-decoration: none; font-size: 1rem;">
                Cancelar
            </a>
        </div>

    </form>
</div>

<script>
    function actualizarAforo(select) {
        const aforo = select.options[select.selectedIndex].getAttribute('data-aforo');
        document.getElementById('capacity').value = aforo || '';
    }
</script>

{% endblock %}
