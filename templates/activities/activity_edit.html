{% extends "base.html" %}

{% block title %}Editar Actividad{% endblock %}

{% block custom_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/activities.css') }}">
{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px;">

    <h2 class="form-title">✏️ Editar actividad</h2>
    <p class="form-subtitle">Modifica los campos que quieras actualizar.</p>

    <form method="post" enctype="multipart/form-data">
        <div>
            <label class="form-label">Título *</label>
            <input type="text" name="title" required value="{{ activity.title }}" class="form-control">
        </div>

        <div>
            <label class="form-label">Descripción *</label>
            <textarea name="description" required rows="4" class="form-control">{{ activity.description }}</textarea>
        </div>

        <div>
            <label class="form-label">Fecha y hora *</label>
            <input type="datetime-local" name="date" required value="{{ activity.date.strftime('%Y-%m-%dT%H:%M') }}" class="form-control">
        </div>

        <div>
            <label class="form-label">Lugar *</label>
            <input type="text" name="location" required value="{{ activity.location }}" class="form-control">
        </div>

        <div>
            <label class="form-label">Aforo máximo <span style="color:#999; font-weight:400;">(opcional)</span></label>
            <input type="number" name="capacity" min="1" value="{{ activity.capacity or '' }}" class="form-control">
        </div>

        <div>
            <label class="form-label">Imagen o cartel <span style="color:#999; font-weight:400;">(opcional, deja vacío para mantener la actual)</span></label>
            {% if activity.image_filename %}
                <img src="{{ url_for('static', filename='uploads/activities/' + activity.image_filename) }}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 0.5rem;">
            {% endif %}
            <input type="file" name="image" accept="image/*" class="form-control">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-create btn-flex">Guardar cambios</button>
            <a href="{{ url_for('activities.activity_detail', activity_id=activity.id) }}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
